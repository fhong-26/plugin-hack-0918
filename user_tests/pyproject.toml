[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rippletide-uat"
version = "0.1.0"
description = "Real local tools and repeatable user acceptance fixtures for Rippletide"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.2.0", "httpx2==2.13.0", "jsonschema==4.26.0"]

[project.scripts]
rippletide-uat = "rippletide_uat.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/rippletide_uat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
